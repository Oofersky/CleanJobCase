server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Docker embedded DNS — иначе после recreate api остаётся старый IP → 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self';" always;

  error_page 403 /403.html;
  error_page 404 /404.html;

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 100s;
    proxy_send_timeout 100s;
  }

  location /js/ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location /css/ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location /platform/ {
    try_files $uri $uri/ /platform/index.html;
  }

  location /resume/ {
    try_files $uri $uri/ /resume/index.html;
  }

  location /login/ {
    try_files $uri $uri/ /login/index.html;
  }

  location /check/ {
    return 302 /platform/;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
