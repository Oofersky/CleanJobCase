server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # Security headers (CSP allows same-origin modules + inline where legacy pages need it)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # microphone=(self) — Web Speech / voice input on this origin; camera & geo stay off
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self';" always;

  error_page 404 /404.html;
  error_page 500 502 503 504 /503.html;

  location = /404.html {
    internal;
  }

  location = /503.html {
    internal;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 /503.html;
  }

  location = / {
    return 302 /site/;
  }

  location /site/ {
    try_files $uri $uri/ =404;
  }

  location /platform/chat/ {
    try_files $uri $uri/ /platform/chat/index.html;
  }

  location /platform/profile/ {
    try_files $uri $uri/ /platform/profile/index.html;
  }

  location /platform/learn/ {
    try_files $uri $uri/ /platform/learn/index.html;
  }

  location /platform/admin/ {
    try_files $uri $uri/ /platform/admin/index.html;
  }

  location /js/ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /css/ {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
