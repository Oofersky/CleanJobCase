services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pv
      POSTGRES_PASSWORD: pv
      POSTGRES_DB: pv
    volumes:
      - pv_pgdata:/var/lib/postgresql/data
    # порт на хост не публикуем: 5432 часто занят локальным Postgres / Windows reserved
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pv -d pv"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8181,http://localhost:8181}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-pv-auth-secret-key-32b}
      SEED_LOGIN: ${SEED_LOGIN:-artemshe}
      SEED_EMAIL: ${SEED_EMAIL:-artemshe@local.dev}
      SEED_PASSWORD: ${SEED_PASSWORD:-artemsheartemshe}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://pv:pv@db:5432/pv}
      VACANCIES_API_URL: ${VACANCIES_API_URL:-http://opendata.trudvsem.ru/api/v1/vacancies/region/39}
      VACANCIES_MAX: ${VACANCIES_MAX:-20}
      VACANCIES_PAGE_LIMIT: ${VACANCIES_PAGE_LIMIT:-10}
      SCHEDULE_INTERVAL_MINUTES: ${SCHEDULE_INTERVAL_MINUTES:-60}
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-false}
      SCHEDULE_USE_AI: ${SCHEDULE_USE_AI:-false}


      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      GIGACHAT_VERIFY_SSL_CERTS: ${GIGACHAT_VERIFY_SSL_CERTS:-true}
      GIGACHAT_TIMEOUT: ${GIGACHAT_TIMEOUT:-60}
      GIGACHAT_MIN_INTERVAL_SECONDS: ${GIGACHAT_MIN_INTERVAL_SECONDS:-0.3}
      GIGACHAT_RETRY_MAX: ${GIGACHAT_RETRY_MAX:-3}
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
    # API только во внутренней сети; снаружи — nginx :8181 → api:8000
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8181:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pv_pgdata:
