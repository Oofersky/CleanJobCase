<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F766E" />
    <meta http-equiv="refresh" content="30" />
    <title>Сервис недоступен — MentOrAI</title>
    <link rel="icon" href="/assets/brand/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body data-zone="site">
    <div class="app">
      <main class="auth-page error-page">
        <section class="form-card ui-panel error-card">
          <div class="form-card__brand">
            <img src="/assets/brand/logo-mark.png" alt="" width="40" height="40" />
            <span>MentOrAI</span>
          </div>
          <p class="error-code">503</p>
          <h1>Сервис временно недоступен</h1>
          <p class="lead">API или сайт на обслуживании. Попробуй обновить страницу чуть позже.</p>
          <div class="panel__actions">
            <a class="btn btn--accent" href="/site/">На главную</a>
            <button class="btn btn--ghost" type="button" onclick="location.reload()">Обновить</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
