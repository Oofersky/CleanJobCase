<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Вход — Прозрачная вакансия</title>
    <meta name="description" content="Вход и регистрация" />
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="auth-page">
    <header class="app-nav">
      <div class="wrap app-nav__inner">
        <a class="brand brand--compact" href="/">
          <span class="brand__mark" aria-hidden="true">
            <img src="/assets/logo.svg" alt="" width="36" height="36" />
          </span>
          <span class="brand__name" translate="no">Прозрачная вакансия</span>
        </a>
        <div class="nav-cluster">
          <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Включить тёмную тему">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap auth-main">
      <section class="auth-card" aria-label="Авторизация">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tabs__btn is-active" role="tab" aria-selected="true" data-tab="login">
            Войти
          </button>
          <button type="button" class="auth-tabs__btn" role="tab" aria-selected="false" data-tab="register">
            Регистрация
          </button>
        </div>

        <form id="form-login" class="auth-form" autocomplete="on">
          <h1 id="auth-title" class="visually-hidden">Войти</h1>
          <label>
            <span>Логин</span>
            <input
              name="login"
              type="text"
              required
              minlength="3"
              maxlength="32"
              pattern="[A-Za-z0-9_]{3,32}"
              autocomplete="username"
            />
          </label>
          <label>
            <span>Пароль</span>
            <input
              name="password"
              type="password"
              required
              minlength="12"
              maxlength="128"
              autocomplete="current-password"
            />
          </label>
          <a class="auth-forgot" href="#forgot" id="auth-forgot">Забыли пароль</a>
          <p class="auth-error" id="login-error" hidden></p>
          <button type="submit" class="btn btn--primary auth-submit">Войти</button>
        </form>

        <form id="form-register" class="auth-form" hidden autocomplete="on">
          <h1 class="visually-hidden">Регистрация</h1>
          <label>
            <span>Логин</span>
            <input
              name="login"
              type="text"
              required
              minlength="3"
              maxlength="32"
              pattern="[A-Za-z0-9_]{3,32}"
              autocomplete="username"
            />
          </label>
          <label>
            <span>Почта</span>
            <input name="email" type="email" required maxlength="255" autocomplete="email" />
          </label>
          <label>
            <span>Пароль</span>
            <input
              name="password"
              type="password"
              required
              minlength="12"
              maxlength="128"
              autocomplete="new-password"
            />
          </label>
          <p class="auth-error" id="register-error" hidden></p>
          <button type="submit" class="btn btn--primary auth-submit">Создать аккаунт</button>
        </form>
      </section>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
