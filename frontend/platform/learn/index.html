<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Окно обучения MentOrAI — база знаний и источники" />
    <meta name="theme-color" content="#0F766E" />
    <title>Обучение — MentOrAI</title>
    <link rel="icon" href="/assets/brand/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/app-shell.css" />
    <link rel="stylesheet" href="/css/workspace.css" />
    <link rel="stylesheet" href="/css/motion.css" />
  </head>
  <body data-zone="platform">
    <a class="skip-link" href="#main">К содержанию</a>
    <div class="app-shell app-shell--platform" data-app-shell>
      <aside class="rail" data-shell-rail aria-label="Навигация"></aside>
      <div class="stage">
        <div class="stage__top" data-shell-top></div>
        <main id="main" class="stage__body stage__body--scroll">
          <div class="workspace" data-learn-root>
            <header class="workspace__hero">
              <h1>Окно обучения</h1>
              <p>
                Материалы из базы знаний по сценарию: темы, кейсы для практики и открытые источники.
                В чате наставник опирается на эти же фрагменты.
              </p>
            </header>
            <div class="workspace__toolbar">
              <div class="field">
                <label for="learn-scenario">Сценарий</label>
                <select id="learn-scenario" data-learn-scenario>
                  <option value="university">Выбор вуза</option>
                  <option value="job">Первая работа</option>
                  <option value="adapt">Первый месяц</option>
                </select>
              </div>
              <div class="field">
                <label for="learn-query">Поиск</label>
                <input id="learn-query" type="search" data-learn-query placeholder="Например: практика, резюме, адаптация" />
              </div>
            </div>
            <p class="workspace__status" data-learn-status role="status"></p>
            <section class="learn-grid" data-learn-topics aria-label="Темы"></section>
            <section class="learn-grid" data-learn-cases aria-label="Кейсы"></section>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/js/learn-page.js"></script>
  </body>
</html>
