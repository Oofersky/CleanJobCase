<!DOCTYPE html>
<html lang="ru" class="is-auth-checking">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Черновик резюме — Прозрачная вакансия</title>
    <meta name="description" content="Черновик резюме под вакансию из сохранённого отчёта" />
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="plat-body">
    <header class="app-nav">
      <div class="wrap app-nav__inner">
        <a class="brand brand--compact" href="/">
          <span class="brand__mark" aria-hidden="true">
            <img src="/assets/logo.svg" alt="" width="36" height="36" />
          </span>
          <span class="brand__name" translate="no">Прозрачная вакансия</span>
        </a>
        <div class="nav-cluster">
          <nav class="nav" aria-label="Разделы">
            <a href="/platform/">Платформа</a>
            <a href="/resume/" aria-current="page">Резюме</a>
          </nav>
          <div id="auth-slot" class="auth-slot"></div>
          <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Включить тёмную тему">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap plat-main">
      <section class="page-head">
        <div>
          <h1>Черновик резюме под вакансию</h1>
          <p>Опыт, навыки и образование — только из вашего резюме.</p>
        </div>
        <div class="history-bar">
          <label class="history-bar__field">
            <span class="history-bar__label">История черновиков</span>
            <select id="draft-history" aria-label="История черновиков">
              <option value="new">Новый черновик</option>
            </select>
          </label>
        </div>
      </section>

      <div class="resume-grid">
        <section class="resume-panel" aria-labelledby="resume-form-title">
          <h2 id="resume-form-title" class="resume-panel__title">Исходные данные</h2>

          <div class="vac-picker" id="vac-picker" role="group" aria-label="Вакансия">
            <div class="filter-bar filter-bar--compact">
              <div class="filter-field filter-field--grow">
                <label for="vac-search">Вакансия</label>
                <div class="toolbar__search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M20 20l-3-3" />
                  </svg>
                  <input
                    id="vac-search"
                    type="search"
                    placeholder="Должность или организация…"
                    autocomplete="off"
                  />
                </div>
              </div>
              <div class="filter-field">
                <label for="vac-company">Организация</label>
                <select id="vac-company">
                  <option value="">Все</option>
                </select>
              </div>
              <div class="filter-bar__meta">
                <button type="button" class="btn btn--ghost btn--compact" id="btn-clear-vac" hidden>
                  Сбросить
                </button>
              </div>
            </div>
            <div
              class="vac-picker__list"
              id="vac-list"
              role="listbox"
              aria-label="Список вакансий"
              tabindex="0"
            ></div>
            <div class="vac-card" id="vacancy-card" hidden>
              <p class="vac-card__job" id="vac-job"></p>
              <p class="vac-card__meta" id="vac-meta"></p>
              <div class="vac-snap vac-snap--compact" id="vac-snap" hidden></div>
              <a class="vac-card__link" id="vac-link" href="#" target="_blank" rel="noopener" hidden
                >Открыть на портале</a
              >
            </div>
          </div>

          <div class="field">
            <label for="full-name">ФИО</label>
            <input id="full-name" type="text" autocomplete="name" />
          </div>

          <div class="field">
            <label for="summary">О себе</label>
            <textarea id="summary" rows="3"></textarea>
          </div>

          <div class="field">
            <label for="skills">Навыки</label>
            <input id="skills" type="text" placeholder="Через запятую" />
          </div>

          <div class="field">
            <label for="experience">Опыт</label>
            <textarea
              id="experience"
              rows="6"
              spellcheck="false"
              placeholder='[{"role":"Должность","company":"Организация","period":"2022–2025","details":"Обязанности"}]'
            ></textarea>
          </div>

          <div class="field">
            <label for="education">Образование</label>
            <textarea
              id="education"
              rows="3"
              spellcheck="false"
              placeholder='[{"degree":"Степень / специальность","school":"Учебное заведение","year":"2022"}]'
            ></textarea>
          </div>

          <div class="resume-actions" id="resume-actions">
            <button type="button" class="btn btn--ghost" id="btn-sample" disabled title="Сначала выберите вакансию">
              Подставить пример
            </button>
            <button type="button" class="btn btn--primary" id="btn-draft">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
              </svg>
              Собрать черновик
            </button>
          </div>
        </section>

        <section class="resume-panel resume-panel--result" aria-labelledby="resume-result-title">
          <div class="resume-panel__head">
            <h2 id="resume-result-title" class="resume-panel__title">Результат</h2>
            <div class="resume-result-actions" id="result-actions" hidden>
              <button type="button" class="btn btn--ghost btn--compact" id="btn-copy">Копировать</button>
              <button type="button" class="btn btn--primary btn--compact" id="btn-new">Новый черновик</button>
            </div>
          </div>
          <div class="error-banner" id="error" role="alert"></div>
          <div class="resume-match" id="result-match" hidden></div>
          <div class="resume-empty" id="result-empty">
            <div class="empty__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <path d="M14 2v6h6" />
                <path d="M8 13h8" />
                <path d="M8 17h5" />
              </svg>
            </div>
            <h3>Черновик ещё не собран</h3>
            <p>Выберите вакансию, при необходимости подставьте пример и нажмите «Собрать черновик».</p>
          </div>
          <pre class="resume-draft" id="draft" hidden></pre>
        </section>
      </div>
    </main>

    <script type="module" src="/js/resume.js"></script>
  </body>
</html>
